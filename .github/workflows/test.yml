name: Test

on:
  pull_request:
  push:
    branches: [ main ]

# The plugins copy their scripts into apps that run anywhere: Linux CI with GNU
# tools, macOS with bash 3.2 and an old system Ruby, and any Ruby from 2.6 up.
# Each job covers one of those. The toolsmith plugin's Rust tools need cargo,
# which the hosted Linux and macOS runners have; REQUIRE_CARGO makes those
# jobs fail instead of skipping the tool tests. The Ruby 2.6 container has no
# cargo, so there the tool tests skip and the Ruby scripts are still tested.
jobs:
  linux:
    name: Linux, Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.3", "4.0" ]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bin/test
        env:
          REQUIRE_CARGO: "1"

  linux-oldest-ruby:
    name: Linux, Ruby 2.6
    runs-on: ubuntu-latest
    container: ruby:2.6
    steps:
      - uses: actions/checkout@v7
      - run: bin/test

  macos:
    name: macOS, system bash and Ruby
    runs-on: macos-latest
    env:
      REQUIRE_CARGO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Tests (scripts on the current Ruby)
        run: bin/test
      - name: Project memory docs (through the plugin's own action)
        uses: ./project-memory
      - name: Scripts on the system Ruby, hooks on bash 3.2
        run: |
          if [ -x /usr/bin/ruby ]; then
            TEST_RUBY=/usr/bin/ruby TEST_BASH=/bin/bash bin/test
          else
            echo "No /usr/bin/ruby on this runner; hooks on bash 3.2 only"
            TEST_BASH=/bin/bash bin/test
          fi
